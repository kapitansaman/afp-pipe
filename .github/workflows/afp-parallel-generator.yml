      AFP_WP_USERNAME: ${{ secrets.AFP_WP_USERNAME }}
      AFP_WP_APP_PASSWORD: ${{ secrets.AFP_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agri-generator-v2-2905-merge593
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow "pypdf>=5,<7"
      - name: Offline safety and 20-worker concurrency tests
        run: python tests/agri_v2/run_offline.py
      - name: Bounded coordinator; advance publishes only fully validated families
        env:
          AFP_PARALLEL_MODE: ${{ inputs.mode }}
        run: python -m automation.agri_v2.parallel_controller --mode "$AFP_PARALLEL_MODE"
      - name: Preserve sanitized results and original progress
        if: always()
        run: bash .github/scripts/persist-agri-v2.sh
      - name: Preserve sanitized recovery evidence even when checkpoint fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            artifacts/agri-v2/
            data/agri-v2/briefs/
            data/agri-v2/status/lifecycle-flight.json
