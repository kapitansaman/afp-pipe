name: AFP parallel - 97-key pool and 20 resumable families
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Single pilot or parallel lifecycle; publication remains validation-gated
        type: choice
        options: [assign, plan, audit, research, bootstrap, trial, advance, white-bean-pilot, readiness, source-search-check, health-refresh, image-refresh, image-refresh-all, image-followup, family-pilot, editorial-repair, editorial-repair-reconcile, rollout-plan, rollout-verify, checkpoint-reconcile, regional-revision, regional-revision-context, regional-revision-recheck, claim-policy-recheck, claim-policy-continuation, claim-policy-regional-final, alfalfa-prepublication-audit]
        default: plan
permissions:
  contents: write
  actions: read
concurrency:
  group: afp-agri-v2-live
  cancel-in-progress: false
jobs:
  coordinator:
    environment: afp-source-search
    if: github.repository == 'kapitansaman/afp-pipe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AFP_PROGRESS_ENABLED: "0"
      AFP_SOURCE_SEARCH_API_KEY: ${{ secrets.AFP_SOURCE_SEARCH_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY_1 }}
