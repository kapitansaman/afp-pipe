name: AFP owned drafting offline validation
on:
  push:
    branches: [fix/canonical-owned-drafting-contract, fix/approved-numeric-drafting-contract, fix/current-article-review-contract, fix/offline-live-circuit-isolation]
  pull_request:
    branches: [feat/agri-generator-v2-2905-merge593]
    paths:
      - automation/agri_v2/**
      - tests/agri_v2/**
      - .github/workflows/afp-parallel-generator.yml
      - .github/workflows/afp-owned-drafting-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow "pypdf>=5,<7"
      - name: Full offline tests; no provider secrets or publication
        run: python tests/agri_v2/run_offline.py
