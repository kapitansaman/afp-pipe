name: AFP owned drafting offline validation
on:
  push:
    branches: [fix/canonical-owned-drafting-contract]
  pull_request:
    branches: [feat/agri-generator-v2-2905-merge593]
    paths:
      - automation/agri_v2/practical_drafting.py
      - automation/agri_v2/failure_diagnostics.py
      - tests/agri_v2/test_owned_drafting_identity.py
      - .github/workflows/afp-owned-drafting-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow "pypdf>=5,<7"
      - name: Full offline tests; no provider secrets or publication
        run: |
          python - <<'PY'
          import socket,unittest
          def blocked(*args,**kwargs):
              raise AssertionError('External network prohibited in offline tests')
          socket.create_connection=blocked
          socket.socket.connect=blocked
          suite=unittest.defaultTestLoader.discover('tests/agri_v2')
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
