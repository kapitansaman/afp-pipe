name: AFP agri v2 - evidence-gated safe activation
on:
  push:
    branches: [feat/agri-generator-v2-2905-merge593]
    paths: [data/agri-v2/production-start-request.json, data/agri-v2/internal-link-repair-request.json, data/agri-v2/practical-finalize-request.json, data/agri-v2/practical-recheck-request.json, data/agri-v2/safe-activation-request.json, data/agri-v2/repair-start-request.json, data/agri-v2/curated-continuation-request.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: afp-agri-v2-live
  cancel-in-progress: false
jobs:
  cycle:
    if: ${{ false }} # Historical one-off workflow disabled after migration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BLOG_IMAGE_QUEUE_TOKEN: ${{ github.token }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY_1 }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY_2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY_3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY_4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY_5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY_6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY_7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY_8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY_9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY_10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY_11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY_12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY_13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY_14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY_15 }}
      AGNES_API_KEY16: ${{ secrets.AGNES_API_KEY_16 }}
      AGNES_API_KEY17: ${{ secrets.AGNES_API_KEY_17 }}
      AGNES_API_KEY18: ${{ secrets.AGNES_API_KEY_18 }}
      AGNES_API_KEY19: ${{ secrets.AGNES_API_KEY_19 }}
      AGNES_API_KEY20: ${{ secrets.AGNES_API_KEY_20 }}
      AGNES_API_KEY21: ${{ secrets.AGNES_API_KEY_21 }}
      AGNES_API_KEY22: ${{ secrets.AGNES_API_KEY_22 }}
      AGNES_API_KEY23: ${{ secrets.AGNES_API_KEY_23 }}
      AGNES_API_KEY24: ${{ secrets.AGNES_API_KEY_24 }}
      AGNES_API_KEY25: ${{ secrets.AGNES_API_KEY_25 }}
      AGNES_API_KEY26: ${{ secrets.AGNES_API_KEY_26 }}
      AGNES_API_KEY27: ${{ secrets.AGNES_API_KEY_27 }}
      AGNES_API_KEY28: ${{ secrets.AGNES_API_KEY_28 }}
      AGNES_API_KEY29: ${{ secrets.AGNES_API_KEY_29 }}
      AGNES_API_KEY30: ${{ secrets.AGNES_API_KEY_30 }}
      AFP_WP_BASE_URL: ${{ secrets.AFP_WP_BASE_URL }}
      AFP_WP_USERNAME: ${{ secrets.AFP_WP_USERNAME }}
      AFP_WP_APP_PASSWORD: ${{ secrets.AFP_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agri-generator-v2-2905-merge593
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Offline safety and integrity tests
        run: python -m unittest discover -s tests/agri_v2 -v
      - name: Validate activation proof then one source-ready quality-gated cycle
        run: |
          python -c "from automation.agri_v2.safe_activation import authorized; assert authorized(), 'Explicit owner authorization and quality policy required'"
          if [ -f data/agri-v2/production-start-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.production_start
          elif [ -f data/agri-v2/internal-link-repair-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.internal_link_repair
          elif [ -f data/agri-v2/practical-recheck-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.practical_recheck
          elif [ -f data/agri-v2/curated-continuation-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.curated_continuation
          elif [ -f data/agri-v2/repair-start-request.json ]; then
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.repair_start
          else
            AFP_PROGRESS_ENABLED=1 python -m automation.agri_v2.cycle --scheduled
          fi
      - name: Preserve receipts and partial progress
        if: always()
        run: bash .github/scripts/persist-agri-v2.sh
